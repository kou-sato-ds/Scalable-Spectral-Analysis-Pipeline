name: Data Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 安定版の3.11を指定

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pandas numpy

      - name: Generate Dummy Data
        run: python tests/generate_dummy_data.py

      - name: Run Data Validation
        run: python tests/validate_data.py